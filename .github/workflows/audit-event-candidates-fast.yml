          cat > assets/img/eventi/CREDITS.md <<'EOF'
          # Crediti e licenze immagini eventi

          Le immagini sono state selezionate per pertinenza reale all'evento, al luogo o al soggetto. Festa del Miele è deliberatamente esclusa dal mapping e dalla migrazione.

          ## Fonti esterne
          - `acque-vive.jpg` — Comune di Pagnacco, locandina “Acque Vive”; contenuti del sito rilasciati CC BY 4.0 salvo diversa indicazione.
          - `autoemoteca.jpg` — Wikimedia Commons, “Blood donation mobile unit.jpg”, CC BY-SA 3.0.
          - `teatro.jpg` — Wikimedia Commons, “Theater stage.jpg”, Beyond silence, CC BY-SA 3.0.
          - `monte-arvenis.jpg` — Wikimedia Commons, “Monte Arvenis.jpg”, Alpino friulano, CC BY-SA 3.0 / GFDL.
          - `lauco-panorama.jpg` — Wikimedia Commons, “Lauco-panorama.jpg”, Sebi1; licenza indicata nella pagina Commons.
          - `avaglio.jpg` — Wikimedia Commons, “Chiesa di Avaglio di Lauco.jpg”; licenza indicata nella pagina Commons.
          - `rosegg-gemellaggio.jpg` — Wikimedia Commons, cartello del gemellaggio di Rosegg con Lauco; licenza indicata nella pagina Commons.
          - `rally.jpg` — Wikimedia Commons, “Rally 023.jpg”, Rosserluke, pubblico dominio.
          - `coro.jpg` — Wikimedia Commons, “Choir in church.jpg”, Peter van der Sluijs, CC BY-SA 3.0.
          - `fiaccolata.jpg` — Wikimedia Commons, “Torchlight procession ... 18.jpg”, Sparrow, CC BY-SA 4.0.
          - `cidules.jpg` — Wikimedia Commons, “Scheibenschlagen in Zams.jpg”, Josef Saurwein, pubblico dominio. Raffigura il medesimo tipo di rito dei dischi infuocati; non è una fotografia di Lauco.
          - `alpini-adunata.jpg` — Wikimedia Commons / Esercito Italiano, adunata Alpini 2024, CC BY 2.5.

          ## Immagini già appartenenti al progetto Lauco Experience
          - `cronoradima.jpg` — locandina CronoRadime.
          - `maina.jpg` — locandina Maina dal Cret.
          - `trava-santuario.jpg` — fotografia locale di Trava.
          - `piattaforma-panoramica.jpg` — fotografia locale della piattaforma panoramica.
          - `tombe-curs.jpg` — fotografia locale delle tombe rupestri / area Curs.
          - `lauco-territorio.jpg` — fotografia della galleria Lauco Experience.
          - `lauco-foliage.jpg` — fotografia autunnale della galleria Lauco Experience.
          - `lauco-inverno.jpg` — fotografia invernale della galleria Lauco Experience.

          Le copie pubblicate sono state solo ridimensionate e compresse in JPEG per l'uso web; il soggetto non è stato alterato.
