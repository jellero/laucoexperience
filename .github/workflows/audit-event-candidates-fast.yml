          # Sanity checks: exactly 45 official event rows, no honey event, and 20 decodable JPEGs.
          test "$(tail -n +2 assets/img/eventi/mapping.csv | wc -l | tr -d ' ')" = '45'
          ! grep -Eqi '(^|,)([^,]*miele[^,]*)(,|$)' assets/img/eventi/mapping.csv
          grep -q "NOT LIKE '%miele%'" migrations/20260811_zzzz_eventi_cover_pertinenti_2026.sql
          test "$(find assets/img/eventi -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = '20'

          rm -rf .event-cover-staging
          rm -f .github/workflows/audit-event-images.yml
          rm -f .github/workflows/audit-event-candidates-fast.yml

      - name: Commit final event covers to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Aggiorna foto eventi pertinenti escluso il miele'
          git push origin HEAD:main
