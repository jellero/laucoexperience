<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153f35">
  <meta name="description" content="Demo web app per esplorare percorsi e luoghi dell'altopiano di Lauco.">
  <title>Lauco Experience — App demo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="../assets/img/logo-square-1.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#home"><img src="../assets/img/logo-square-1.png" alt=""><span>Lauco Experience</span></a>
      <div class="top-actions">
        <button class="icon-btn" type="button" data-install aria-label="Installa app">⇩</button>
        <button class="avatar" type="button" data-go="profile" aria-label="Profilo demo">JE</button>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="nav" class="bottom-nav" aria-label="Navigazione principale"></nav>
  </div>
  <div id="modal"></div>
  <div id="toast" aria-live="polite"></div>

  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 7-5 1 3-7z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20 6a5 5 0 0 0-7 0l-1 1-1-1a5 5 0 0 0-7 7l8 8 8-8a5 5 0 0 0 0-7z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V4m0 1h11l-2 3 2 3H5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h2a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m3 18 7-9 4 5 3-4 4 8"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24"><path d="m21 3-7 18-3-8-8-3z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></symbol>
  </svg>
  <script src="app.js" defer></script>
  <script src="search-fix.js" defer></script>
</body>
</html>
