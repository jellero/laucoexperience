name: Finalize event covers

on:
  push:
    paths:
      - '.github/workflows/audit-event-candidates-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified event cover set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .event-cover-staging
          mkdir -p .event-cover-staging assets/img/eventi

          get() {
            curl -fL --max-time 45 --retry 2 "$1" -o ".event-cover-staging/$2"
          }

          # External reusable sources selected for exact event/place/subject relevance.
          get 'https://pagnacco-api.municipiumapp.it/s3/4905/media/acque-vive-cristina-noacco-pagnacco.jpg' 'acque-vive.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Blood%20donation%20mobile%20unit.jpg?width=1600' 'autoemoteca.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Theater%20stage.jpg?width=1600' 'teatro.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Monte%20Arvenis.jpg?width=1600' 'monte-arvenis.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lauco-panorama.jpg?width=1600' 'lauco-panorama.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chiesa%20di%20Avaglio%20di%20Lauco.jpg?width=1600' 'avaglio.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rosegg%2C%20Partnerschaft%20Partnerstvo%20Gemellagio%20und%20Partnerst%C3%A4dte%20Bohinj%2C%20Zuglio%2C%20Lauco%20und%20Osoppo.jpg?width=1600' 'rosegg-gemellaggio.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rally%20023.jpg?width=1600' 'rally.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Choir%20in%20church.jpg?width=1600' 'coro.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Torchlight%20procession%20for%20the%20search%20of%20missing%20boy%20Odin%20Andre%20Hagen%20Jacobsen%2018.jpg?width=1600' 'fiaccolata.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Scheibenschlagen%20in%20Zams.jpg?width=1600' 'cidules.jpg'
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Italian%20Army%20-%207th%20Alpini%20Regiment%20flag%20is%20paraded%20through%20Vicenza%20during%20the%20National%20Alpine%20Association%20gathering%202024.png?width=1600' 'alpini-adunata.png'

          # Exact/local project-owned material already present in the repository.
          cp assets/img/cronoradima.jpg .event-cover-staging/cronoradima.jpg
          cp assets/img/alpini.jpg .event-cover-staging/maina.jpg
          cp uploads/luoghi/chiesa-trava-20260610213911-b2a7c5.jpg .event-cover-staging/trava-santuario.jpg
          cp uploads/luoghi/terrazza-20260610214112-b51f01.jpg .event-cover-staging/piattaforma-panoramica.jpg
          cp uploads/luoghi/loc-porteal-20260610213800-b92b1a.jpg .event-cover-staging/tombe-curs.jpg
          cp uploads/galleria/20260602115819-8d1e78c683a2.jpg .event-cover-staging/lauco-territorio.jpg
          cp uploads/galleria/20260602115819-720fa682e9f3.jpg .event-cover-staging/lauco-foliage.jpg
          cp uploads/galleria/20260602115819-3f83ada6f160.jpg .event-cover-staging/lauco-inverno.jpg

          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('.event-cover-staging')
          dst = Path('assets/img/eventi')
          dst.mkdir(parents=True, exist_ok=True)

          expected = {
              'acque-vive.jpg', 'alpini-adunata.png', 'autoemoteca.jpg', 'avaglio.jpg',
              'cidules.jpg', 'coro.jpg', 'cronoradima.jpg', 'fiaccolata.jpg',
              'lauco-foliage.jpg', 'lauco-inverno.jpg', 'lauco-panorama.jpg',
              'lauco-territorio.jpg', 'maina.jpg', 'monte-arvenis.jpg',
              'piattaforma-panoramica.jpg', 'rally.jpg', 'rosegg-gemellaggio.jpg',
              'teatro.jpg', 'tombe-curs.jpg', 'trava-santuario.jpg'
          }
          found = {p.name for p in src.iterdir() if p.is_file()}
          missing = sorted(expected - found)
          if missing:
              raise SystemExit(f'Missing candidate images: {missing}')

          for old in dst.glob('*'):
              if old.is_file() and old.name not in {'CREDITS.md', 'mapping.csv'}:
                  old.unlink()

          for name in sorted(expected):
              p = src / name
              out = dst / (p.stem + '.jpg')
              with Image.open(p) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  im.save(out, 'JPEG', quality=86, optimize=True, progressive=True)

          finals = list(dst.glob('*.jpg'))
          if len(finals) != 20:
              raise SystemExit(f'Expected 20 final JPEGs, got {len(finals)}')
          for p in finals:
              with Image.open(p) as im:
                  im.verify()
          PY

          cat > assets/img/eventi/mapping.csv <<'EOF'
